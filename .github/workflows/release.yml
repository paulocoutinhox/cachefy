name: release

# A release happens on a tag and on nothing else, because every other way in is one where the check below does not run.
on:
  push:
    tags: ["v*"]

jobs:
  # A version on pypi is permanent, so the suite answers for it before anything is built.
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # And so does the load, because what a graded suite cannot reach is exactly what a permanent version must not carry.
  stress:
    uses: ./.github/workflows/stress.yml

  build:
    needs: [test, stress]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A tag that disagrees with the version is a release published under a number nobody asked for, and pypi never lets that number be used again.
      - name: check the tag is the version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          test "$tagged" = "$declared" || { echo "the tag says $tagged and pyproject.toml says $declared"; exit 1; }

      - name: build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # What is published is what was checked, so the job that uploads never builds a second time.
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The environment the trusted publisher on pypi is bound to, and the gate an approval rule hangs off.
    environment:
      name: pypi
      url: https://pypi.org/p/cachefy

    permissions:
      # What mints the openid token pypi trades for an upload, which is why there is no api token anywhere here.
      id-token: write
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: announce the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
