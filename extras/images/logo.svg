        <rect x="78" y="194" width="88" height="18" rx="9" fill="#ffffff" opacity="0.62"/>
    </g>

    <!-- The bolt, because what a cache answers is the same value without the work behind it. -->
    <path d="M 336 38 L 404 38 L 362 142 L 420 142 L 318 282 L 354 170 L 304 170 Z" fill="#00b6a3"/>

